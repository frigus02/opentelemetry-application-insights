on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: CI

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: Run cargo build (trace only)
        run: cargo build --no-default-features --features trace
      - name: Run cargo build (logs only)
        run: cargo build --no-default-features --features logs
      - name: Run cargo build (metrics only)
        run: cargo build --no-default-features --features metrics
      - name: Run cargo test
        run: cargo test --all-features
      - name: Run cargo fmt
        run: cargo fmt -- --check
      - name: Run cargo clippy
        run: cargo clippy --all-features
      - name: Build tracing example
        run: cargo build --manifest-path examples/tracing/Cargo.toml
  check_external_types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-03-20
          components: rustfmt
      - name: Intall cargo-check-external-types
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-check-external-types@0.5.0
      - name: Run cargo check-external-types
        run: cargo check-external-types --all-features
  # Some dependencies' (direct and transitive) latest versions use edition
  # 2024, which isn't available with Rust 1.75 (MSRV). I'm pretty sure we are
  # compatible with older versions that don't use 2024, yet. The same build
  # worked for a while and then started failing without any changes here. Not
  # sure how to solve this properly. For now, disable the workflow because it's
  # failing before it can test anything.
